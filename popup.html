<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Relic</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="shell">
    <header class="header">
      <span class="wordmark">Relic</span>
      <button id="settings-btn" class="settings-btn" title="Settings">Settings</button>
    </header>

    <div id="setup" class="block hidden">
      <p class="muted">Connect your Relic server to save pages.</p>
      <button id="open-settings" class="btn btn-primary">Open Settings</button>
    </div>

    <div id="saved" class="block saved-view hidden">
      <div id="saved-icon" class="saved-icon">
        <svg viewBox="0 0 16 16" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6">
          <path id="saved-icon-path" d="M3 8.5 6.5 12 13 4.5"/>
        </svg>
      </div>
      <p id="saved-text" class="saved-text">Saved to your library.</p>
    </div>

    <div id="main" class="hidden">
      <label class="field-label">Page URL</label>
      <input type="url" id="page-url" class="input" readonly>

      <label class="field-label">Title</label>
      <input type="text" id="title" class="input" placeholder="Auto-detected if empty">

      <label class="field-label">Note</label>
      <textarea id="note" class="input input-textarea" rows="2" placeholder="Personal note (optional)"></textarea>

      <label class="field-label">Collection</label>
      <div class="row">
        <select id="collection" class="input select"></select>
        <button id="new-collection-btn" class="icon-btn" title="New collection" aria-label="New collection">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M8 3v10M3 8h10"/>
          </svg>
        </button>
      </div>
      <div id="new-collection-form" class="hidden row">
        <input type="text" id="new-collection-name" class="input" placeholder="Collection name">
        <button id="new-collection-create" class="btn btn-outline">Add</button>
      </div>

      <label class="field-label">Tags</label>
      <input type="text" id="tag-filter" class="input" placeholder="Search or add a tag..." autocomplete="off">
      <div id="tag-dropdown" class="tag-dropdown hidden"></div>

      <div id="message" class="message"></div>
      <div id="error" class="error" role="alert"></div>

      <div class="footer">
        <div class="footer-left">
          <button id="delete-btn" class="btn btn-danger hidden">Delete</button>
        </div>
        <button id="save-btn" class="btn btn-primary">Save to Library</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
